name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gradle:
    name: Gradle (AGP) build, unit tests, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, release APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleRelease
      - name: Show APK
        run: ls -l app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-outputs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/
          if-no-files-found: warn

  sdk-tools:
    name: SDK-tools build (scripts/build-apk.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Kotlin compiler
        run: |
          curl -sSfL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip
          unzip -q kotlinc.zip -d "$RUNNER_TEMP"
          echo "KOTLIN_HOME=$RUNNER_TEMP/kotlinc" >> "$GITHUB_ENV"
      - name: SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" > /dev/null
      - name: Build APK
        run: BUILD_TOOLS=36.0.0 scripts/build-apk.sh
      - name: Unit tests
        run: |
          curl -sSfLO https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSfLO https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          JUNIT_JARS="$PWD/junit-4.13.2.jar:$PWD/hamcrest-core-1.3.jar" scripts/run-unit-tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-tools-apk
          path: build/offline/FullAutoClicker-*.apk
